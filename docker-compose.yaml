services:

  nginx:
    image: nginx:alpine
    container_name: judo_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx_config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_frontend
      - app_backend

  app_frontend:
    build:
      context: ./judo_frontend/JudoTournamentWeb/
      dockerfile: Dockerfile
    container_name: judo_stream_frontend
    ports:
      - "5173:5173"
    depends_on:
      - app_backend

  app_backend:
    build:
      context: ./judo_backend      # Добавьте эту строку!
      dockerfile: Dockerfile
    container_name: judo_stream_backend
    ports:
      - "5001:5001"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DOCKER_CONNECTION: ${DOCKER_CONNECTION}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: judo_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    #      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres-data: