services:

  app:
    build:
      dockerfile: Dockerfile
    container_name: judo_stream_backend
    ports:
      - "5001:5001"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DOCKER_CONNECTION: ${DOCKER_CONNECTION}
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: judo_streams_postgres_1
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=judo_tournament
    volumes:
      - postgres-data:/var/lib/postgresql/data
#      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"

  redis:
    image: redis:alpine
    container_name: judo_streams_redis_1
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    volumes:
      - redis_data:/var/redisdata/data

volumes:
    postgres-data:
    redis_data: